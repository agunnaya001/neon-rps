<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <g stroke="#ff00ff" stroke-opacity="0.08">
    <line x1="0" y1="60"  x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>
  <g stroke="#00ffff" stroke-opacity="0.06">
    <line x1="200"  y1="0" x2="200"  y2="360"/>
    <line x1="400"  y1="0" x2="400"  y2="360"/>
    <line x1="600"  y1="0" x2="600"  y2="360"/>
    <line x1="800"  y1="0" x2="800"  y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>
  <rect x="20" y="20" width="1160" height="320" fill="none" stroke="#ff00ff" stroke-width="3" stroke-opacity="0.7" filter="url(#glow)"/>
  <text x="60" y="120" font-family="ui-monospace, monospace" font-size="42" font-weight="bold" fill="#00ffff" letter-spacing="6" filter="url(#glow)">COMMIT · REVEAL · WIN</text>
  <text x="60" y="240" font-family="ui-monospace, monospace" font-size="108" font-weight="900" fill="#ff00ff" filter="url(#glow)" letter-spacing="2">NEON RPS</text>
  <text x="60" y="300" font-family="ui-monospace, monospace" font-size="22" fill="#ffff00" letter-spacing="4" filter="url(#glow)">PROVABLY FAIR · ON BASE · 2.5% FEE ON WINS</text>
  <g transform="translate(960, 100)" filter="url(#glow)">
    <text font-family="ui-monospace, monospace" font-size="92" fill="#ff00ff" x="0"   y="100">✊</text>
    <text font-family="ui-monospace, monospace" font-size="92" fill="#00ffff" x="80"  y="100">✋</text>
    <text font-family="ui-monospace, monospace" font-size="92" fill="#ffff00" x="160" y="100">✌</text>
  </g>
</svg>
