kind = "web"
previewPath = "/"
title = "Neon RPS"
version = "1.0.0"
id = "artifacts/neon-rps"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24029

[services.development]
run = "pnpm --filter @workspace/neon-rps run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/neon-rps", "run", "build" ]
publicDir = "artifacts/neon-rps/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24029"
BASE_PATH = "/"
